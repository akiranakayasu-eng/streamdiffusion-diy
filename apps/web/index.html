<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StreamDiffusion DIY</title>
<style>
  :root { --bg:#111; --fg:#eee; --mut:#999; --acc:#4fa3ff; --warn:#ffb347; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.5 -apple-system, "Hiragino Sans", sans-serif; }
  main { max-width:560px; margin:0 auto; padding:12px 16px 40px; }
  h1 { font-size:17px; margin:4px 0 10px; }
  #out { width:100%; aspect-ratio:1; background:#000; border-radius:8px; display:block; }
  #src { width:96px; aspect-ratio:1; object-fit:cover; border-radius:6px;
         position:absolute; right:8px; top:8px; border:1px solid #444; background:#000; }
  .stage { position:relative; }
  .row { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; }
  button, select, input[type=text] { font:inherit; color:var(--fg); background:#222;
         border:1px solid #444; border-radius:8px; padding:10px 12px; }
  input[type=text] { flex:1; min-width:0; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#000; font-weight:600; }
  button:disabled { opacity:.4; }
  label.file { border:1px solid #444; border-radius:8px; padding:10px 12px; background:#222; }
  label.file input { display:none; }
  #status { color:var(--mut); font-size:13px; margin-top:8px; min-height:1.5em; }
  #status.warn { color:var(--warn); }
  small { color:var(--mut); }
</style>
</head>
<body>
<main>
  <h1>StreamDiffusion DIY（Modal）</h1>
  <div class="stage">
    <canvas id="out" width="512" height="512"></canvas>
    <video id="src" playsinline muted loop></video>
  </div>

  <div class="row">
    <button id="camFront">前カメラ</button>
    <button id="camBack">後ろカメラ</button>
    <label class="file">動画ファイル<input id="file" type="file" accept="video/*"></label>
  </div>
  <div class="row">
    <input id="prompt" type="text" value="watercolor painting, vivid colors" aria-label="プロンプト" placeholder="プロンプト">
  </div>
  <div class="row">
    <label><input id="negOn" type="checkbox"> ネガティブ</label>
    <input id="negative" type="text" value="blurry, low quality, text, watermark" aria-label="ネガティブプロンプト" placeholder="ネガティブプロンプト">
  </div>
  <div class="row" id="gRow">
    <label for="guidance">ガイダンス</label>
    <input id="guidance" type="range" min="1" max="3" step="0.1" value="1.5" style="flex:1">
    <span id="gval">1.5</span>
  </div>
  <div class="row">
    <select id="strength" aria-label="変換の強さ">
      <option value="weak">弱い</option>
      <option value="normal">ふつう</option>
      <option value="strong" selected>強い</option>
    </select>
    <select id="size" aria-label="大きさ">
      <option value="256">256</option>
      <option value="384">384</option>
      <option value="512" selected>512</option>
    </select>
    <button id="apply">設定を反映</button>
  </div>
  <div class="row">
    <button id="start" class="primary" disabled>開始</button>
    <button id="stop" disabled>停止</button>
    <span id="fps"></span>
  </div>
  <div id="status">カメラか動画ファイルを選んでください。</div>
  <p><small>ネガティブは ON のときだけ使い（すぐ切り替わります）、少し遅くなります。ガイダンスはネガティブが ON のときだけ効きます。1 回最長 10 分で自動停止します。画面を閉じたり別のアプリに移ったりしても止まります。GPU は使っているあいだだけ課金されます。</small></p>
</main>

<script>
const $ = (id) => document.getElementById(id);
const key = new URLSearchParams(location.search).get("key") || "";
const video = $("src"), out = $("out"), octx = out.getContext("2d");
const grab = document.createElement("canvas"), gctx = grab.getContext("2d");
let ws = null, stream = null, running = false, frames = 0, t0 = 0, timer = null;

function status(msg, warn) { $("status").textContent = msg; $("status").className = warn ? "warn" : ""; }

function stopSource() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.pause(); video.removeAttribute("src"); video.srcObject = null;
}

async function useCamera(facing) {
  stopSource();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: 640, height: 640 }, audio: false });
    video.srcObject = stream; await video.play();
    $("start").disabled = false; status("準備ができました。「開始」を押してください。");
  } catch (e) { status("カメラを使えません: " + e.message, true); }
}
$("camFront").onclick = () => useCamera("user");
$("camBack").onclick = () => useCamera({ ideal: "environment" });
$("file").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  stopSource(); video.src = URL.createObjectURL(f); await video.play();
  $("start").disabled = false; status("準備ができました。「開始」を押してください。");
};

function settings() {
  return JSON.stringify({ prompt: $("prompt").value, negative: $("negOn").checked ? $("negative").value : "",
    guidance: +$("guidance").value, strength: $("strength").value, size: +$("size").value });
}
$("guidance").oninput = () => { $("gval").textContent = (+$("guidance").value).toFixed(1); };
function showNeg() {
  const on = $("negOn").checked;
  $("negative").style.display = on ? "" : "none";
  $("gRow").style.display = on ? "" : "none";
}
showNeg();
$("negOn").onchange = () => { showNeg(); if (ws && ws.readyState === 1) ws.send(settings()); };
$("apply").onclick = () => { if (ws && ws.readyState === 1) ws.send(settings()); };

// 返事を待たずに最大 3 枚まで先に送る（日本と米国の往復約 0.4 秒の待ちを重ねて隠す）
const MAX_INFLIGHT = 3;
let inflight = 0;
function pump() { while (running && inflight < MAX_INFLIGHT) { inflight++; sendFrame(); } }

function sendFrame() {
  if (!running || !ws || ws.readyState !== 1) { inflight = Math.max(0, inflight - 1); return; }
  const size = +$("size").value;
  grab.width = grab.height = size;
  const w = video.videoWidth, h = video.videoHeight, s = Math.min(w, h);
  if (!s) { setTimeout(sendFrame, 50); return; }   // 映像の準備待ち（inflight はそのまま）
  gctx.drawImage(video, (w - s) / 2, (h - s) / 2, s, s, 0, 0, size, size);
  grab.toBlob(b => {
    if (running && ws && ws.readyState === 1) ws.send(b); else inflight = Math.max(0, inflight - 1);
  }, "image/jpeg", 0.8);
}

function start() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws?key=${encodeURIComponent(key)}`);
  ws.binaryType = "blob";
  status("GPU を起こしています（最初は 1 分ほどかかることがあります）…");
  $("start").disabled = true; $("stop").disabled = false;
  ws.onmessage = async (ev) => {
    if (typeof ev.data === "string") {
      const m = JSON.parse(ev.data);
      if (m.error) { status(m.error, true); stop(); }
      else if (m.stopped) { status(m.stopped, true); stop(); }
      else if (m.ready) {
        running = true; frames = 0; inflight = 0; t0 = performance.now();
        ws.send(settings()); status("変換中");
        timer = setTimeout(() => { status("10 分たったので止めました", true); stop(); }, m.session_max_sec * 1000);
      } else if (m.configured) { pump(); }
      return;
    }
    const bmp = await createImageBitmap(ev.data);
    octx.drawImage(bmp, 0, 0, out.width, out.height);
    frames++;
    if (frames % 10 === 0) $("fps").textContent = (frames * 1000 / (performance.now() - t0)).toFixed(1) + " fps";
    inflight = Math.max(0, inflight - 1);
    pump();   // 1 枚返ってきたら 1 枚足す（先送りは最大 3 枚なので遅れはためない）
  };
  ws.onclose = () => { if (running) status("接続が切れました。続けるときは「開始」を押してください。", true); stop(); };
  ws.onerror = () => { if (!$("status").classList.contains("warn")) status("接続が途中で切れました。もう一度「開始」を押してください。", true); };
}

function stop() {
  running = false; clearTimeout(timer);
  if (ws) { try { ws.close(); } catch (e) {} ws = null; }
  $("start").disabled = !(stream || video.src); $("stop").disabled = true;
}
$("start").onclick = start;
$("stop").onclick = () => { stop(); status("止めました。"); };
document.addEventListener("visibilitychange", () => { if (document.hidden && running) { stop(); status("画面を離れたので止めました。", true); } });
window.addEventListener("pagehide", stop);
if (!key) status("URL に ?key=合言葉 が付いていません。", true);
</script>
</body>
</html>
